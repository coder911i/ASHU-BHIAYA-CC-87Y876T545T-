<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="vsr-icon-roof" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="vsr-icon-ascent" x1="40" y1="80" x2="80" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="vsr-icon-bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A1128" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
  </defs>

  <!-- Background Base Container -->
  <rect width="100" height="100" rx="24" fill="url(#vsr-icon-bg)" stroke="#1E293B" stroke-width="2" />

  <!-- Architectural Shield / Roof Contour -->
  <path d="M50 14 L82 34 V60 C82 74 67 85 50 89 C33 85 18 74 18 60 V34 L50 14 Z" 
        fill="#0D1B2A" stroke="#1E293B" stroke-width="1.5" />

  <!-- Outer Roof Gable Line -->
  <path d="M26 37 L50 20 L74 37" 
        stroke="url(#vsr-icon-roof)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Financial Growth Upward Pillar / V Chevron -->
  <path d="M34 50 L50 68 L66 50" 
        stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- S-Curve Interlock Motif -->
  <path d="M43 56 C43 51 57 49 57 43 C57 39 52 37 46 39" 
        stroke="#818CF8" stroke-width="3.5" stroke-linecap="round" fill="none" />
  
  <!-- Central Apex Growth Beacon -->
  <circle cx="50" cy="30" r="4" fill="#38BDF8" />

  <!-- Upward Trend Accent Bar -->
  <path d="M56 65 L69 48" 
        stroke="url(#vsr-icon-ascent)" stroke-width="4" stroke-linecap="round" />
</svg>
