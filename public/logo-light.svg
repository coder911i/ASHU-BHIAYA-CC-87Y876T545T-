<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none">
  <defs>
    <linearGradient id="vsr-roof-grad-light" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="vsr-gold-ascent-light" x1="40" y1="80" x2="80" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Emblem / Icon Group -->
  <g transform="translate(10, 8)">
    <rect x="2" y="2" width="80" height="80" rx="20" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />

    <!-- Architectural Shield / Roof Contour -->
    <path d="M42 6 L78 28 V56 C78 70 62 82 42 86 C22 82 6 70 6 56 V28 L42 6 Z" 
          fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />

    <!-- Outer Roof Gable Line -->
    <path d="M14 31 L42 12 L70 31" 
          stroke="url(#vsr-roof-grad-light)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Financial Growth Upward Pillar / V Chevron -->
    <path d="M24 45 L42 64 L60 45" 
          stroke="#0284C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Dynamic S-Curve Interlock & R Pillar -->
    <path d="M34 52 C34 46 50 44 50 38 C50 34 44 32 38 34" 
          stroke="#4F46E5" stroke-width="3" stroke-linecap="round" fill="none" />
    
    <!-- Central Apex Growth Beacon -->
    <circle cx="42" cy="24" r="3.5" fill="#0284C7" />

    <!-- Upward Trend Accent Bar -->
    <path d="M48 60 L62 42" 
          stroke="url(#vsr-gold-ascent-light)" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Typography: VSR ASSOCIATES -->
  <g transform="translate(108, 22)">
    <!-- Primary Acronym -->
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" 
          font-size="34" font-weight="800" letter-spacing="0.08em" fill="#0F172A">
      VSR<tspan fill="#0284C7">.</tspan>
    </text>
    <text x="100" y="32" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" 
          font-size="28" font-weight="600" letter-spacing="0.12em" fill="#334155">
      ASSOCIATES
    </text>

    <!-- Subtitle: Full Legal Entity Name -->
    <text x="2" y="54" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" 
          font-size="9.5" font-weight="600" letter-spacing="0.22em" fill="#0284C7">
      VRINDA SHREE RADHA ASSOCIATES
    </text>

    <!-- Financial Services Tagline -->
    <text x="2" y="68" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" 
          font-size="8.5" font-weight="500" letter-spacing="0.16em" fill="#64748B">
      FINANCIAL CONSULTING &amp; LOAN FACILITATION
    </text>
  </g>
</svg>
